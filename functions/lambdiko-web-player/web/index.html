<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>Lambdiko Player</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>Lambdiko Player</h1>
      <button id="logout" type="button" hidden>ログアウト</button>
    </header>

    <section id="login-view" hidden>
      <p id="login-message">ログインしてください。</p>
      <button id="login" type="button">ログイン</button>
    </section>

    <main id="main-view" hidden>
      <div class="toolbar">
        <input id="search" type="search" placeholder="タイトル・局で絞り込み" autocomplete="off" />
        <label><input id="hide-done" type="checkbox" /> 聴き終えたものを隠す</label>
        <button id="reload" type="button" title="一覧を再読み込み">↻</button>
      </div>
      <p id="status" role="status"></p>
      <ul id="episodes"></ul>
    </main>

    <footer id="player" hidden>
      <div class="now">
        <span id="now-title"></span>
        <span id="now-meta"></span>
      </div>
      <audio id="audio" controls preload="metadata"></audio>
      <div class="controls">
        <button id="back" type="button">−15秒</button>
        <button id="fwd" type="button">+30秒</button>
        <select id="rate" aria-label="再生速度">
          <option value="0.75">0.75×</option>
          <option value="1">1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="1.75">1.75×</option>
          <option value="2">2×</option>
        </select>
      </div>
    </footer>

    <template id="episode-tpl">
      <li>
        <button type="button" class="episode">
          <span class="title"></span>
          <span class="meta"></span>
          <progress max="1" value="0"></progress>
        </button>
      </li>
    </template>
  </body>
</html>
